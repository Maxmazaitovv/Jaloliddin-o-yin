name: Build Android APK from ZIP

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project archive
        run: |
          rm -rf game_src
          mkdir -p game_src
          unzip -o "*.zip" -d game_src
          if [ ! -f "game_src/settings.gradle" ]; then
            SUBDIR=$(find game_src -maxdepth 2 -name "settings.gradle" -exec dirname {} \; | head -n 1)
            if [ -n "$SUBDIR" ]; then
              mv "$SUBDIR"/* game_src/ 2>/dev/null || true
            fi
          fi
          ls -la game_src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK and Gradle wrapper
        working-directory: game_src
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.4 --distribution-type bin
          fi
          chmod +x ./gradlew

      - name: Build Debug APK
        working-directory: game_src
        run: |
          set -o pipefail
          ./gradlew assembleDebug --console=plain 2>&1 | tee build.log
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== ASOSIY XATO QATORLARI ==="
            grep -E "FAILURE:|Execution failed|error:|Could not|No such file|Plugin .* was not found" build.log | tail -n 25 || true
          fi
          exit $EXIT_CODE

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: manguberdi-debug-apk
          path: game_src/app/build/outputs/apk/debug/app-debug.apk
