name: Build Android APK from ZIP

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project archive
        run: |
          rm -rf game_src
          mkdir -p game_src
          unzip -o "*.zip" -d game_src
          if [ ! -f "game_src/settings.gradle" ]; then
            SUBDIR=$(find game_src -maxdepth 2 -name "settings.gradle" -exec dirname {} \; | head -n 1)
            if [ -n "$SUBDIR" ]; then
              mv "$SUBDIR"/* game_src/ 2>/dev/null || true
            fi
          fi
          ls -la game_src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Android SDK and licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Configure local.properties and Gradle wrapper
        working-directory: game_src
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.4 --distribution-type bin
          fi
          chmod +x ./gradlew

      - name: Build Debug APK
        working-directory: game_src
        run: ./gradlew assembleDebug --console=plain --stacktrace

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: manguberdi-debug-apk
          path: game_src/app/build/outputs/apk/debug/app-debug.apk
