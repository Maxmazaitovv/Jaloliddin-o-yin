
name: Build Jaloliddin Manguberdi APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Extract game ZIP
        run: |
          mkdir -p game
          unzip -o jaloliddin-manguberdi-game-v2.zip -d game

      - name: Build APK
        run: |
          cd game
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jaloliddin-Manguberdi-APK
          path: game/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
