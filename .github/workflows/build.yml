
name: Jaloliddin Manguberdi Game APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP file
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found!"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> $GITHUB_ENV

      - name: Extract project
        run: |
          mkdir -p game
          unzip -o "$ZIP_FILE" -d game

          echo "Project files:"
          find game -maxdepth 3 -type f | head -100

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Locate Gradle project
        run: |
          GRADLE_FILE=$(find game -name gradlew -type f | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: gradlew not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jaloliddin-Manguberdi-APK
          path: |
            game/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
